<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track your daily expenses with ease. Add, view, and manage your spending.">
    <title>Expense Tracker | Manage Your Finances</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">💰</span>
                    <h1>Expense Tracker</h1>
                </div>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Dashboard Summary Section -->
            <section class="dashboard" id="dashboard">
                <div class="summary-card total-card">
                    <h3>Total Expenses</h3>
                    <p class="amount" id="total-amount">$0.00</p>
                </div>
                <div class="summary-card count-card">
                    <h3>Transactions</h3>
                    <p class="count" id="expense-count">0</p>
                </div>
            </section>

            <!-- Add Expense Form Section -->
            <section class="form-section">
                <h2>Add New Expense</h2>
                <form id="expense-form" class="expense-form">
                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" min="0.01"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="Food">🍔 Food</option>
                            <option value="Transport">🚗 Transport</option>
                            <option value="Shopping">🛒 Shopping</option>
                            <option value="Entertainment">🎬 Entertainment</option>
                            <option value="Bills">📄 Bills</option>
                            <option value="Health">💊 Health</option>
                            <option value="Other">📦 Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="note">Note (Optional)</label>
                        <input type="text" id="note" name="note" placeholder="Add a note..." maxlength="500">
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        <span class="btn-text">Add Expense</span>
                        <span class="btn-loader hidden"></span>
                    </button>
                </form>
            </section>

            <!-- Filters Section -->
            <section class="filters-section">
                <div class="filters">
                    <div class="filter-group">
                        <label for="filter-category">Filter by Category</label>
                        <select id="filter-category">
                            <option value="all">All Categories</option>
                            <option value="Food">🍔 Food</option>
                            <option value="Transport">🚗 Transport</option>
                            <option value="Shopping">🛒 Shopping</option>
                            <option value="Entertainment">🎬 Entertainment</option>
                            <option value="Bills">📄 Bills</option>
                            <option value="Health">💊 Health</option>
                            <option value="Other">📦 Other</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="sort-by">Sort by</label>
                        <select id="sort-by">
                            <option value="date-desc">Newest First</option>
                            <option value="date-asc">Oldest First</option>
                            <option value="amount-desc">Highest Amount</option>
                            <option value="amount-asc">Lowest Amount</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Expenses List Section -->
            <section class="expenses-section">
                <h2>Recent Expenses</h2>
                <div id="expenses-list" class="expenses-list">
                    <!-- Expenses will be dynamically inserted here -->
                    <div class="empty-state" id="empty-state">
                        <span class="empty-icon">📋</span>
                        <p>No expenses yet. Add your first expense above!</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Expense Tracker. Built with ❤️</p>
        </footer>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>

</html>
